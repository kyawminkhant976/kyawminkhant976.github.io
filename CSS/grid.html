<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Lessons</title>
    <link rel="stylesheet" href="./css/custom.css">
</head>
<body>
    
    <h1>Grid Lessons</h1>

    <div class="gridOne">
        <div style="background-color: red;">1</div>
        <div style="background-color: green;">2</div>
        <div style="background-color: blue;">3</div>
        <div style="background-color: yellow;">4</div>
        <div style="background-color: pink;">5</div>
        <div style="background-color: purple;">6</div>
        <div style="background-color: brown;">7</div>
        <div style="background-color: rgb(221, 0, 255);">8</div>
        <div style="background-color: rgb(153, 255, 0);">9</div>
    </div>

    <h1>Grid Row And Column Add</h1>

    <h2>Grid Column Add</h2>

    <div class="gridTwo">
        <div style="background-color: red;" >1</div>
        <div style="background-color: green;">2</div>
        <div style="background-color: blue;">3</div>
        <div style="background-color: yellow;">4</div>
        <div style="background-color: pink;" class="columnAdd">5</div>
        <div style="background-color: purple;">6</div>
        <div style="background-color: brown;">7</div>
        <div style="background-color: rgb(221, 0, 255);">8</div>
        <div style="background-color: rgb(153, 255, 0);">9</div>
    </div>

    <h2>Grid Row Add</h2>

    <div class="gridThree">
        <div style="background-color: red;" >1</div>
        <div style="background-color: green;">2</div>
        <div style="background-color: blue;">3</div>
        <div style="background-color: yellow;">4</div>
        <div style="background-color: pink;" class="rowAdd" >5</div>
        <div style="background-color: purple;">6</div>
        <div style="background-color: brown;">7</div>
        <div style="background-color: rgb(221, 0, 255);">8</div>
        <div style="background-color: rgb(153, 255, 0);">9</div>
    </div>
</body>
</html>
